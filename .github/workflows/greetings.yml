name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Thank You for helping on making this project better!!"
        pr-message: " Hi @username! Thanks for opening your first PR here! 🥳  We really appreciate you taking the time to contribute. A maintainer will review your changes shortly. If we need any modifications, we will let you know right here in the comments. Welcome to the project! 🙌"


